<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">

</head><body><div id="app">
<section id="auth" class="auth-shell"><div class="auth-card"><div class="brand-mark">أ</div><p class="eyebrow">منصة إدارة تعليمية</p><h1>أكاديميا</h1><p class="muted">متابعة الطلاب والحضور والمدفوعات في مكان واحد</p>
<form id="auth-form" class="stack"><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="email" placeholder="name@example.com"></label><label>كلمة المرور<input id="password" type="password" minlength="6" required autocomplete="current-password" placeholder="••••••••"></label><button id="auth-submit">تسجيل الدخول</button></form>
<button id="forgot-password" type="button" class="text-button">نسيت كلمة المرور؟</button><form id="reset-form" class="stack" hidden><label>كلمة المرور الجديدة<input id="new-password" type="password" minlength="6" required autocomplete="new-password" placeholder="••••••••"></label><button type="submit">حفظ كلمة المرور الجديدة</button></form>
<button id="toggle-auth" class="text-button">ليس لديك حساب؟ إنشاء حساب</button><p id="auth-message" class="notice"></p></div></section>
<div id="dashboard" class="app-shell" hidden><aside class="sidebar"><div class="brand"><div class="brand-mark small">أ</div><div><b>أكاديميا</b><small>إدارة ومتابعة الطلاب</small></div></div><div class="profile"><div class="avatar">أ</div><div><b id="user-email"></b><small id="role-label">الإدارة</small></div></div><nav id="nav"></nav><div class="sidebar-bottom"><button id="backup" class="nav-item" title="نسخة احتياطية" aria-label="نسخة احتياطية">⇩ نسخة احتياطية</button><button id="logout" class="nav-item logout" title="تسجيل الخروج" aria-label="تسجيل الخروج">↪ تسجيل الخروج</button></div></aside>
<main class="main"><header class="topbar"><div><p class="eyebrow">لوحة التحكم</p><h1 id="page-title">نظرة عامة</h1></div><span class="date-chip" id="today"></span></header><div id="message" class="notice-banner" hidden></div><section id="content"></section><footer>أكاديميا · نظام متابعة الطلاب <span>صلاحيات وصول منفصلة لكل حساب</span></footer></main></div></div></body></html>
